# ========================================================
#  强制全走 D 盘，绝不碰 C 盘
# ========================================================
org.gradle.user.home=D:\\gradle-home
org.gradle.java.home=D:\\yyrj\\Java\\jdk-17

# ========================================================
#  Android SDK（D 盘）
# ========================================================
systemProp.android.home=D:\\yyrj\\AndroidSDK
systemProp.android.sdk.root=D:\\yyrj\\AndroidSDK

# ========================================================
#  Flutter 引擎仓库（腾讯云国内镜像）
#  Flutter Gradle 插件拼的 URL = FLUTTER_STORAGE_BASE_URL + /download.flutter.io
#  所以 BASE_URL 必须带 /flutter，最终是：
#    https://mirrors.cloud.tencent.com/flutter/download.flutter.io/io/flutter/...
# ========================================================
systemProp.FLUTTER_STORAGE_BASE_URL=https://mirrors.cloud.tencent.com/flutter

# ========================================================
#  Dart pub 镜像 —— 不在这里设 PUB_HOSTED_URL！
#  用户级环境变量已是清华源 mirrors.tuna.tsinghua.edu.cn/dart-pub（缓存全量）
#  这里设了会覆盖清华源 → pub-cache 新源没下载过的包就找不到
# ========================================================
systemProp.FLUTTER_STORAGE_URL=https://mirrors.cloud.tencent.com/flutter

# ========================================================
#  Gradle JVM 参数
# ========================================================
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ========================================================
#  AndroidX（必须开启）
# ========================================================
android.useAndroidX=true
android.enableJetifier=true
