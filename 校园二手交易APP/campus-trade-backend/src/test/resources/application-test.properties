# 测试环境配置
spring.application.name=campus-trade-test
server.port=8081

# 测试数据库配置（使用H2内存数据库）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 禁用安全配置以简化测试
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# 日志配置
logging.level.com.campus.trade=INFO
logging.level.org.hibernate.SQL=WARN

# 禁用文件上传限制
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 测试环境不启用邮件
spring.mail.host=localhost
spring.mail.port=2525

# Redis配置（测试环境禁用缓存）
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=1000ms

# 禁用Redis自动配置
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# 测试配置类
spring.main.allow-bean-definition-overriding=true

# 幂等性配置（测试环境禁用）
idempotency.enabled=false