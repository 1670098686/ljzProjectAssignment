server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": Asia/Shanghai
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

logging:
  level:
    "[com.campus.trade]": ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}-] %c{1} - %m%n"

jwt:
  secret: ${JWT_SECRET:campus-trade-secret-key-with-minimum-256-bits-length-required}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  issuer: ${JWT_ISSUER:campus-trade}

file:
  upload-root: ${FILE_UPLOAD_ROOT:/app/uploads}
  public-prefix: /upload

mail:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:no-reply@campus-trade.local}
  signature: ${MAIL_SIGNATURE:【校园二手交易】}
  support-email: ${MAIL_SUPPORT_EMAIL:support@campus-trade.local}
  app-base-url: ${MAIL_APP_BASE_URL:https://app.campus-trade.local}
  max-attempts: ${MAIL_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${MAIL_RETRY_BACKOFF:1500}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: campus-trade-backend
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

app:
  idempotency:
    enabled: ${IDEMPOTENCY_ENABLED:true}
    ttl-minutes: ${IDEMPOTENCY_TTL_MINUTES:30}
