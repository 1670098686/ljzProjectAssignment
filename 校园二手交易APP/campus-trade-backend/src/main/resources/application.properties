# ================================================================
# Campus Trade - Default application configuration (dev profile)
# ================================================================

spring.application.name=campus-trade
spring.profiles.active=dev

server.port=8080
server.servlet.context-path=/
server.address=0.0.0.0

# --- Datasource --------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.username=root
spring.datasource.password=liujian3732028
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# --- JPA & Hibernate ---------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=never

# --- File upload -------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Static assets -----------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# --- Logging -----------------------------------------------------
logging.level.com.campus.trade=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# --- Swagger / OpenAPI ------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- File storage (see FileStorageProperties) --------------------
file.upload-root=target/classes/static/upload
file.public-prefix=/upload

# --- Spring main configuration -----------------------------------
spring.main.allow-circular-references=true

# --- JWT security ------------------------------------------------
jwt.secret=campus-trade-secret-key-with-minimum-256-bits-length-required
jwt.expiration-seconds=7200
jwt.issuer=campus-trade

# --- Redis cache configuration ------------------------------------
spring.cache.type=simple
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.timeout=2000ms
# spring.data.redis.connect-timeout=1000ms
# spring.cache.redis.time-to-live=3600000
# spring.cache.redis.cache-null-values=false

# --- Zipkin tracing (disabled) ------------------------
spring.zipkin.enabled=false
spring.sleuth.enabled=false

