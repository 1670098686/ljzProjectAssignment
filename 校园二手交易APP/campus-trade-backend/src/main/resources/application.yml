server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: test
    password: ""
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true
    show-sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

logging:
  level:
    com:
      campus:
        trade: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}-] %c{1} - %m%n"

jwt:
  secret: campus-trade-secret-key-with-minimum-256-bits-length-required
  expiration-seconds: 7200
  issuer: campus-trade

file:
  upload-root: src/main/resources/static/upload
  public-prefix: /upload

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

mail:
  enabled: false
  from: ""
  signature: "【校园二手交易】"
  support-email: "support@campus-trade.com"
  app-base-url: "https://app.campus-trade.com"
  max-attempts: 3
  retry-backoff-millis: 1500

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: campus-trade-backend
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

app:
  idempotency:
    enabled: ${IDEMPOTENCY_ENABLED:true}
    ttl-minutes: ${IDEMPOTENCY_TTL_MINUTES:30}

payment:
  mock:
    # 是否在模拟环境下默认直接视为支付成功
    always-success: ${PAYMENT_MOCK_ALWAYS_SUCCESS:false}

websocket:
  endpoint: /ws
  allowed-origin-patterns:
    - "*"
  application-destination-prefixes:
    - /app
  simple-broker-prefixes:
    - /topic
    - /queue
  user-destination-prefix: /user
  heartbeat:
    server: 15s
    client: 15s
  transport:
    message-size-limit: 65536
    send-buffer-size-limit: 524288
    send-time-limit: 20000
  inbound:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 1000
  outbound:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 1000