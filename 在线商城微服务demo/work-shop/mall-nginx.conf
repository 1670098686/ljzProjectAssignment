worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=10r/s;

    upstream mall_gateway {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        root d:/BaiduNetdiskDownload/class/work-shop/mall-frontend/dist;
        index index.html;

        access_log logs/mall.access.log main;
        error_log logs/mall.error.log warn;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=ip_limit burst=20 nodelay;
            proxy_pass http://mall_gateway/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location ~* /(\.git|\.env|backup|config|.*\.sql)$ {
            deny all;
            return 403;
        }
    }
}